<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rangmarg — Shared Itinerary</title>
  <meta name="description" content="A travel itinerary shared via Rangmarg.">
  <meta property="og:title" content="Rangmarg — Shared Itinerary">
  <meta property="og:description" content="Check out this travel itinerary planned on Rangmarg.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/share.css">
  <script>
    (function(){
      var k="rangmarg_theme";
      var s=localStorage.getItem(k);
      var d=s||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
      document.documentElement.setAttribute("data-theme",d);
    })();
  </script>
</head>
<body>
  <main class="share-page">
    <div class="share-card" id="share-card">
      <div class="share-loading">Loading itinerary...</div>
    </div>
  </main>
  <script src="js/share.js"></script>
</body>
</html>
