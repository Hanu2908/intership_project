<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Rangmarg</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script>
  (function(){
    var k="rangmarg_theme";
    var s=localStorage.getItem(k);
    var d=s||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light");
    document.documentElement.setAttribute("data-theme",d);
  })();
</script>
<style>
  .error-page{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: var(--paper); padding: 40px 24px;
  }
  .error-card{
    text-align:center; max-width:420px;
  }
  .error-stamp{
    width:96px; height:96px; border-radius:50%; margin:0 auto 28px;
    border: 2px dashed var(--line-strong); color: var(--ink-muted);
    display:flex; align-items:center; justify-content:center;
    transform: rotate(-8deg);
    animation: errorStampIn .6s var(--ease-spring) both;
  }
  .error-stamp svg{ width:40px; height:40px; }
  @keyframes errorStampIn{
    from{ opacity:0; transform: rotate(-20deg) scale(0.6); }
    to{ opacity:1; transform: rotate(-8deg) scale(1); }
  }
  .error-code{
    font-family: var(--font-mono); font-size:64px; font-weight:700;
    color: var(--ink); letter-spacing:-0.03em; line-height:1;
    margin-bottom:8px;
  }
  .error-title{
    font-family: var(--font-display); font-size:22px; font-weight:700;
    color: var(--ink); margin-bottom:8px;
  }
  .error-msg{
    font-size:14px; color: var(--ink-muted); margin-bottom:28px; line-height:1.6;
  }
  .error-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
  <main class="error-page">
    <div class="error-card">
      <div class="error-stamp" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M16 16s-1.5-2-4-2-4 2-4 2"/>
          <line x1="9" y1="9" x2="9.01" y2="9"/>
          <line x1="15" y1="9" x2="15.01" y2="9"/>
        </svg>
      </div>
      <div class="error-code">404</div>
      <h1 class="error-title">Stamp not found</h1>
      <p class="error-msg">This destination doesn't exist in our passport. It may have been moved or the link is wrong.</p>
      <div class="error-actions">
        <a href="index.html" class="btn-primary">Back to home</a>
        <a href="javascript:history.back()" class="btn-secondary">Go back</a>
      </div>
    </div>
  </main>
</body>
</html>
